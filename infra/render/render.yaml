# Render.com config-as-code
# See: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: familyroots-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: singapore  # closest to Vietnam
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: familyroots-db
          property: connectionString
      - key: APP_SECRET_KEY
        generateValue: true
      # Required in production: the config fail-fast rejects a wildcard host
      # allowlist. JSON list (pydantic-settings parses complex env vars as JSON).
      - key: ALLOWED_HOSTS
        value: '["familyroots-api.onrender.com"]'
    healthCheckPath: /health
    # Run DB migrations before each deploy goes live (blocks the deploy on failure).
    preDeployCommand: alembic upgrade head
    # TODO: add remaining production env vars from .env.example
    # (SUPABASE_URL/keys, CORS_ORIGINS, SENTRY_DSN, Firebase) before go-live.

databases:
  - name: familyroots-db
    plan: starter
    region: singapore
    postgresMajorVersion: "18"
    databaseName: familyroots
    user: familyroots
