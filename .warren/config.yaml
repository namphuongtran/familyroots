# Warren per-project config (read by the operator's Warren server at dispatch).
#
# agentImage: the container image each Warren run of this repo starts in. It carries
# the toolchain the quality gates need: Python 3.14.2 via uv, pnpm 10.6.0, Flutter 3.44.8,
# postgresql-client-18, and Playwright Chromium 1.62.1 (web/pnpm-lock.yaml). The image is
# built on the operator host from ~/.warren/agent-images/familyroots/Dockerfile. When a PR
# bumps one of those versions, rebuild the image with it (namphuongtran/warren#54).
agentImage: familyroots-agent:latest

# ciFixer: when a check fails on a pull request a Warren run opened, Warren dispatches a repair
# run onto that pull request's branch, with the failing check names and the job's log tail in
# its prompt. The repair commits to the same branch, so the checks run again.
#
# - role: claude-code, not the default pr-fixer. pr-fixer runs on the pi harness, which
#   authenticates only with ANTHROPIC_API_KEY, and the operator's Warren holds a Claude Code
#   OAuth token. The repair instructions are in the dispatch prompt either way.
# - maxRetries: 1. The agent image has no Docker or Supabase CLI, so a repair to an Image E2E
#   failure is verified by CI alone. One attempt per pull request, then a human looks.
# - logTailLines: 500. Image E2E prints the backend log (200 lines) and cleanup after a failed
#   e2e step, 249 lines after the failure on PR #384, so the default 200 never reached the
#   Playwright error.
ciFixer:
  enabled: true
  role: claude-code
  maxRetries: 1
  logTailLines: 500

# maxCostUsd: the per-run USD cap for a run whose dispatch names none. A ciFixer run is one:
# its dispatch carries no cap and the claude-code agent declares none. Dispatches that name a
# cap, such as the operator's issue queue, keep their own.
maxCostUsd: 10

# repoContext: free text Warren adds to the prompt of every run of this repo, after the agent's
# system section and before the task. It routes each ticket to a skill in .claude/skills/. A
# marketplace plugin enabled in .claude/settings.json does not load inside a Warren sandbox (the
# run's init event lists only builtin plugins), so the two skills are vendored from
# mattpocock-skills 1.2.3 (MIT, license next to each SKILL.md). The last line makes the choice
# auditable: the approach note says which skill the run followed.
repoContext: |
  This repository vendors two engineering skills in .claude/skills/. Use them:
  - A ticket labelled `bug`: follow the diagnosing-bugs skill. Build a command that goes red on
    this bug before you change any code, and keep it as the regression test.
  - Any other ticket that changes behaviour: follow the tdd skill. Write the failing test first,
    run it and see it fail, then make it pass.
  - A ticket that changes no runtime behaviour (docs, CI wiring, config): say so in the approach
    note and skip both skills.
  In the approach note, name the skill you followed under "Chosen approach", and list the red
  command you ran under "Verification".
