name: family_roots_mobile
description: FamilyRoots mobile app — Android and iOS.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: 3.3.1
  riverpod_annotation: 4.0.2
  go_router: 17.3.0
  dio: 5.11.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  supabase_flutter: 2.16.0
  flutter_secure_storage: 10.3.1
  sqflite: 2.4.3
  shared_preferences: ^2.5.3
  sentry_flutter: 9.26.0
  intl: 0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.15.1
  riverpod_generator: 4.0.3
  riverpod_lint: 3.1.3
  freezed: 3.2.5
  json_serializable: 6.13.0
  mocktail: 1.0.5
  http_mock_adapter: 0.6.1
  sqflite_common_ffi: 2.4.2
  path: ^1.9.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  # Bundled, never fetched at runtime: google_fonts falls back to the system
  # font offline, which violates the Arbor Heritage typography mandate
  # (ADR-034 D4). Only variable fonts exist upstream, so the same TTF is
  # declared twice and the wght axis supplies the weight.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
          weight: 400
        - asset: assets/fonts/Manrope.ttf
          weight: 700
