services:
  pgdb:
    image: postgres:18-alpine
    container_name: familyroots-pgdb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-family_roots}
    volumes:
      # Postgres 18+ stores data in a major-version subdir; mount at the parent
      # (/var/lib/postgresql), not /data, or the image errors on an "unused mount".
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - familyroots

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: familyroots-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pgdb:5432/${POSTGRES_DB:-family_roots}
      APP_ENV: development
      APP_DEBUG: "true"
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me-in-production}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-family-roots-files}
    depends_on:
      pgdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./backend/app:/app/app:ro
    # Dev bootstrap: migrate to head before serving so a fresh pgdb volume works
    # out of the box (an unmigrated DB previously 500'd on nearly every endpoint).
    command: sh -c "python -m alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - familyroots

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: familyroots-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@familyroots.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    depends_on:
      - pgdb
    networks:
      - familyroots

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      # S-071: Next.js inlines every `NEXT_PUBLIC_*` value into the browser bundle
      # during `pnpm build`, which runs inside this build step — not at container
      # start. The `environment:` block below is run time and cannot reach a value
      # a Client Component already had baked into its JS at build time
      # (`web/src/components/auth/SupabaseSetupNotice.tsx` is the proof: it is
      # `'use client'` and reads both, so it renders the "Supabase not configured"
      # banner no matter what `environment:` supplies, unless the same values were
      # also given here). THIS MAKES THE IMAGE ENVIRONMENT-SPECIFIC: an image built
      # with `.env`'s staging Supabase project has that project's URL and anon key
      # burned into it and cannot be promoted to production unchanged. Rebuild
      # (`docker compose build web`) with the target environment's `.env` before
      # promoting.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: familyroots-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # `NEXT_PUBLIC_SUPABASE_URL`/`_ANON_KEY` here are inert for this container: S-071
      # measured that every `NEXT_PUBLIC_*` name is inlined into the built JS wherever
      # `pnpm build` sees it referenced — `middleware.ts` and the callback route
      # included, not only Client Components — so the values that actually reach this
      # image are the `build.args` above, and these two lines below do nothing once the
      # image is built. Kept anyway for a non-Docker `pnpm dev`/`pnpm build` run against
      # this same `.env`, and not removed, so this file still shows where the value
      # comes from for that case.
      #
      # `NEXT_PUBLIC_API_URL` was not investigated by S-071 beyond confirming it is
      # NOT given a `build.args` entry above, on purpose (out of that seed's scope) —
      # but it reaches a Client Component transitively too (`src/lib/api/axios.ts`,
      # imported by `'use client'` hooks such as `useMembers.ts`), and its build-time
      # value differs by caller: `src/lib/server/auth-context.ts` needs the
      # compose-network hostname `http://api:8000/api/v1` for server-to-server calls,
      # while a browser needs a host-reachable origin instead. One literal cannot
      # satisfy both once it is baked at build time, so this is a second, undecided
      # instance of the same defect class S-071 fixed for Supabase's two variables,
      # not merely S-071's Out of scope. Flagged to the coordinator; not fixed here.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:8000/api/v1}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - familyroots

volumes:
  pgdata:

networks:
  familyroots:
    driver: bridge
