services:
  pgdb:
    image: postgres:18-alpine
    container_name: familyroots-pgdb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-family_roots}
    volumes:
      # Postgres 18+ stores data in a major-version subdir; mount at the parent
      # (/var/lib/postgresql), not /data, or the image errors on an "unused mount".
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - familyroots

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: familyroots-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pgdb:5432/${POSTGRES_DB:-family_roots}
      APP_ENV: development
      APP_DEBUG: "true"
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me-in-production}
      # Use `supabase.localhost`, never `127.0.0.1`. The Supabase stack pins its
      # token issuer to this hostname via `[auth] external_url` in supabase/config.toml,
      # because 127.0.0.1 cannot mean both the host and the inside of a container.
      # `supabase status` prints the 127.0.0.1 form; pasting it here yields 401
      # invalid_token against a perfectly healthy stack. Measured 2026-08-22.
      SUPABASE_URL: ${SUPABASE_URL:-http://supabase.localhost:54321}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-family-roots-files}
    depends_on:
      pgdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Resolves `supabase.localhost` to the host, where the Supabase stack runs.
    # This line is load-bearing: without it the container cannot reach the issuer and
    # every token is rejected. Verified on macOS 2026-08-22; re-check it on
    # CI, where an /etc/hosts entry is the fallback.
    extra_hosts:
      - "supabase.localhost:host-gateway"
    volumes:
      - ./backend/app:/app/app:ro
    # Dev bootstrap: migrate to head before serving so a fresh pgdb volume works
    # out of the box (an unmigrated DB previously 500'd on nearly every endpoint).
    command: sh -c "python -m alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - familyroots

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: familyroots-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@familyroots.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    depends_on:
      - pgdb
    networks:
      - familyroots

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      # Next.js inlines every `NEXT_PUBLIC_*` value into the browser bundle
      # during `pnpm build`, which runs inside this build step — not at container
      # start. The `environment:` block below is run time and cannot reach a value
      # a Client Component already had baked into its JS at build time
      # (`web/src/components/auth/SupabaseSetupNotice.tsx` is the proof: it is
      # `'use client'` and reads both, so it renders the "Supabase not configured"
      # banner no matter what `environment:` supplies, unless the same values were
      # also given here). THIS MAKES THE IMAGE ENVIRONMENT-SPECIFIC: an image built
      # with `.env`'s staging Supabase project has that project's URL and anon key
      # burned into it and cannot be promoted to production unchanged. Rebuild
      # (`docker compose build web`) with the target environment's `.env` before
      # promoting.
      #
      # `NEXT_PUBLIC_API_URL` joined the two above by ADR-056, which
      # decided it holds the *browser-facing* origin only — host-reachable from
      # wherever a browser on the host runs, `http://localhost:8000/api/v1` by default,
      # since `api`'s port 8000 is published to the host below. It is deliberately NOT
      # the compose-network hostname `http://api:8000/api/v1`: a browser cannot resolve
      # that name, only another container on the `familyroots` network can. The
      # server-to-server value lives in a *separate*, non-public `API_URL` runtime
      # variable below — see that comment for why the split exists and ADR-056 for the
      # full decision and what each deployment shape needs.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: familyroots-web
    restart: unless-stopped
    # The server half of Next.js (middleware, route handlers) reaches Supabase
    # by this name too. See the api service above for why it is not 127.0.0.1.
    extra_hosts:
      - "supabase.localhost:host-gateway"
    ports:
      - "3000:3000"
    environment:
      # `NEXT_PUBLIC_SUPABASE_URL`/`_ANON_KEY` here are inert for this container: the build
      # measured that every `NEXT_PUBLIC_*` name is inlined into the built JS wherever
      # `pnpm build` sees it referenced — `middleware.ts` and the callback route
      # included, not only Client Components — so the values that actually reach this
      # image are the `build.args` above, and these two lines below do nothing once the
      # image is built. Kept anyway for a non-Docker `pnpm dev`/`pnpm build` run against
      # this same `.env`, and not removed, so this file still shows where the value
      # comes from for that case.
      #
      # `NEXT_PUBLIC_API_URL` reaches a Client Component transitively too
      # (`src/lib/api/axios.ts`, imported by `'use client'` hooks such as
      # `useMembers.ts`), so it is inert here for the identical reason, in the built
      # image — kept for the same non-Docker `pnpm dev`/`pnpm build` case, and now
      # matching the *browser-facing* default the `build.args` above bakes in, not the
      # compose-network hostname a browser cannot resolve.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      # ADR-056: the server-to-server value. `API_URL` carries no `NEXT_PUBLIC_`
      # prefix, so Next.js never inlines it — `src/lib/server/auth-context.ts` reads
      # `process.env.API_URL` live, at request time, inside this already-built image.
      # This is genuinely run time, unlike the two lines above: the compose-network
      # hostname `http://api:8000/api/v1` is correct here because this fetch runs
      # inside the `web` container, on the same `familyroots` network as `api`, never
      # in a browser.
      API_URL: ${API_URL:-http://api:8000/api/v1}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - familyroots

volumes:
  pgdata:

networks:
  familyroots:
    driver: bridge
