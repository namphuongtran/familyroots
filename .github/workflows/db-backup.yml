name: db-backup
on:
  schedule:
    - cron: "15 17 * * *"   # 17:15 UTC = 00:15 Asia/Ho_Chi_Minh
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: gate
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$PROD_DATABASE_URL" ] || [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::notice::db-backup secrets not configured — skipping (see docs/ops/backup-restore.md go-live checklist)"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      # pg_dump refuses a server newer than itself, and production is 17. Installing the
      # client is not enough: /usr/bin/pg_dump is Debian's pg_wrapper, which runs the
      # version of the runner's one local cluster, 16/main, when no -h or PGHOST names a
      # host. A connection-string argument names none, so the run of 2026-10-10 dumped
      # with 16 and failed (#282). Putting 18's own bin directory first on PATH bypasses
      # the wrapper. Re-pin when production passes 18.
      - name: Install postgres client 18
        if: steps.gate.outputs.configured == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - name: Run backup
        if: steps.gate.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bash scripts/db_backup.sh
