name: PR Checks

on:
  pull_request:
    # `edited` is required so a title-only fix re-runs the Conventional-Commits
    # check — the default activity types (opened/synchronize/reopened) do not fire
    # on a title edit, which otherwise leaves the check stuck at its first result.
    types: [opened, synchronize, reopened, edited]
    branches: [main, develop]

# The semantic-pull-request and gitleaks actions read PR metadata/commits via the
# API; without an explicit grant the default token can be contents-read-only,
# which fails with "Resource not accessible by integration" (HTTP 403).
permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-commits:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits
        uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            infra
            test
            refactor
            style
            perf
            ci
          requireScope: false

  secret-scanning:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  no-env-files:
    name: Check no .env files committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check for .env files
        run: |
          # Find .env files that are NOT .env.example
          ENV_FILES=$(find . -name '.env' -o -name '.env.local' -o -name '.env.*.local' | grep -v '.env.example' || true)
          if [ -n "$ENV_FILES" ]; then
            echo "::error::Found .env files that should not be committed:"
            echo "$ENV_FILES"
            exit 1
          fi
          echo "No .env files found — OK"
