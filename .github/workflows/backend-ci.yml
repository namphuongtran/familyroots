name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: family_roots_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen --dev

      # The gate is one script shared with local dev (scripts/check.sh): CI and
      # humans always run the identical, lockfile-pinned commands — a branch
      # that fails here fails locally and vice versa.
      - name: Gate (format, lint, import contracts, types, tests)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/family_roots_test
          APP_ENV: testing
          APP_SECRET_KEY: test-secret-key
        run: ./scripts/check.sh

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

  deploy:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      # Deploy secrets are an owner go-live action (docs/ops/configuration.md).
      # Until they exist, skip with a warning instead of failing the run — a
      # red main on unconfigured infra hides real test regressions. Once the
      # secret is added, deploys trigger automatically on the next push.
      - name: Trigger Render deploy (skips until RENDER_DEPLOY_HOOK is configured)
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK secret not configured — skipping Render deploy (owner go-live action)"
            exit 0
          fi
          curl -f -s -S "$RENDER_DEPLOY_HOOK"
