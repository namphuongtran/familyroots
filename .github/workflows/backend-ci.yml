name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      # The backend unit suite guards three things that live outside backend/:
      # docs/ops/migrations.md, infra/ table and policy DDL,
      # and scripts/ SQL, both the .sql files a shell script feeds to psql and
      # the statements a shell script runs inline through psql -c. Without
      # these filters a pull request that only touches those paths runs no gate at all.
      # supabase/ since #202: test_auth_email_templates.py reads the two auth email
      # templates and both configs that carry them, and the hosted-only one,
      # supabase/supabase/config.toml, is where docs/ops/supabase-hosted-project.md
      # trap 4 bites. image-e2e reads the local config, never that one.
      - "docs/ops/migrations.md"
      - "infra/**"
      - "scripts/**"
      - "supabase/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "docs/ops/migrations.md"
      - "infra/**"
      - "scripts/**"
      - "supabase/**"
  # release.yml runs this gate on the tagged commit before it deploys (#267). This workflow
  # deploys nothing: a merge to main reaches production only through a release.
  workflow_call:

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: family_roots_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The rate limit's shared store, as docker-compose.yml runs it (ADR-072):
      # tests/integration/test_rate_limit_shared_store.py reaches Redis through
      # serverless-redis-http, which answers Upstash's REST API, on 127.0.0.1:8079.
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis-http:
        image: hiett/serverless-redis-http:0.0.10
        env:
          SRH_MODE: env
          SRH_TOKEN: familyroots-local-redis-http
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - 8079:80

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen --dev

      # tests/integration/test_restore_bootstrap_on_supabase_shape.py runs pg_dump, pg_restore
      # and psql, and pg_dump refuses a server newer than itself. The runner's own pg_dump is
      # 16 (#282), so this installs 18, the service's major, into /usr/lib/postgresql/18/bin,
      # where that test finds it. Re-pin with the service image.
      - name: Install postgres client 18
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-18

      # The gate is one script shared with local dev (scripts/check.sh): CI and
      # humans always run the identical, lockfile-pinned commands — a branch
      # that fails here fails locally and vice versa.
      - name: Gate (format, lint, import contracts, types, tests)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/family_roots_test
          APP_ENV: testing
          APP_SECRET_KEY: test-secret-key
        run: ./scripts/check.sh

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
