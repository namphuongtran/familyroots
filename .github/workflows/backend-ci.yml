name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      # The backend unit suite guards three things that live outside backend/:
      # docs/ops/migrations.md, infra/ table and policy DDL,
      # and scripts/ SQL, both the .sql files a shell script feeds to psql and
      # the statements a shell script runs inline through psql -c. Without
      # these filters a pull request that only touches those paths runs no gate at all.
      # supabase/ since #202: test_auth_email_templates.py reads the two auth email
      # templates and both configs that carry them, and the hosted-only one,
      # supabase/supabase/config.toml, is where docs/ops/supabase-hosted-project.md
      # trap 4 bites. image-e2e reads the local config, never that one.
      - "docs/ops/migrations.md"
      - "infra/**"
      - "scripts/**"
      - "supabase/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "docs/ops/migrations.md"
      - "infra/**"
      - "scripts/**"
      - "supabase/**"

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: family_roots_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen --dev

      # The gate is one script shared with local dev (scripts/check.sh): CI and
      # humans always run the identical, lockfile-pinned commands — a branch
      # that fails here fails locally and vice versa.
      - name: Gate (format, lint, import contracts, types, tests)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/family_roots_test
          APP_ENV: testing
          APP_SECRET_KEY: test-secret-key
        run: ./scripts/check.sh

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

  # Migrate, deploy, then read /health (#252). Render ran the migration as its
  # preDeployCommand; Vercel runs nothing before a deployment goes live, so this job does.
  # docs/ops/deployment.md, "Pipeline", has the order and why each step is where it is.
  deploy:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Two pushes to main close together must not migrate one database at once: Alembic
    # takes no lock of its own. Queue the second run; never cancel one mid-migration.
    concurrency:
      group: backend-production-deploy
      cancel-in-progress: false
    # Each secret is passed only to the step that needs it, so neither `uv sync` nor the
    # migration ever sees the Vercel token.
    steps:
      - uses: actions/checkout@v4

      # Deploy secrets are an owner go-live action (docs/ops/deployment.md, "Go-live
      # checklist"). Until every one exists, skip with a warning instead of failing the
      # run: a red main on unconfigured infra hides real test regressions. A partial set
      # skips too, and the warning names what is missing, so the job never migrates a
      # database it then does not deploy against, or deploys code it then does not read.
      - name: Check deploy configuration
        id: gate
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_API_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: |
          missing=""
          [ -n "$MIGRATION_DATABASE_URL" ] || missing="$missing secret:MIGRATION_DATABASE_URL"
          [ -n "$VERCEL_TOKEN" ] || missing="$missing secret:VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing secret:VERCEL_ORG_ID"
          [ -n "$VERCEL_API_PROJECT_ID" ] || missing="$missing secret:VERCEL_API_PROJECT_ID"
          [ -n "$API_ORIGIN" ] || missing="$missing variable:API_ORIGIN"
          if [ -n "$missing" ]; then
            echo "::warning::Backend deploy not configured (missing:$missing) — skipping migrate, Vercel deploy and health read (owner go-live action)"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.gate.outputs.configured == 'true'
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        if: steps.gate.outputs.configured == 'true'
        run: uv python install

      - name: Install runtime dependencies
        if: steps.gate.outputs.configured == 'true'
        run: uv sync --frozen --no-dev

      # MIGRATION_DATABASE_URL is Supavisor's SESSION pooler on :5432, not the transaction
      # pooler the app uses on :6543. The direct host is IPv6-only without the IPv4 add-on,
      # and GitHub Actions has no IPv6. Settings needs DATABASE_URL and nothing else here:
      # APP_ENV is unset, so it reads "development" and the production validator does not
      # run. migrations/env.py takes the URL from settings.DATABASE_URL.
      - name: Migrate the production database
        if: steps.gate.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          uv run --no-sync alembic upgrade head
          uv run --no-sync alembic current

      - name: Set up Node.js
        if: steps.gate.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # VERCEL_ORG_ID and VERCEL_PROJECT_ID name the project, so the CLI needs no
      # .vercel/project.json. No --yes: that flag answers project set-up questions with
      # defaults. With the ids wrong, this step should fail, not create a project. Vercel
      # builds from the upload, and backend/.vercelignore decides what is uploaded.
      - name: Deploy to Vercel (familyroots-api)
        if: steps.gate.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
        run: |
          url="$(npx --yes vercel@63.1.0 deploy --prod --token="$VERCEL_TOKEN")"
          echo "Deployment: $url"
          echo "Deployed $url to production." >> "$GITHUB_STEP_SUMMARY"

      # Read after the fact. The deployment is already production when this runs. A red
      # step means production is serving it, so roll back (docs/ops/deployment.md,
      # "Rollback"). Read through the production host: Standard Protection guards the
      # deployment's own URL, and ALLOWED_HOSTS admits only the production host. The first
      # request cold-starts an instance, whose lifespan refuses to boot unless the database
      # is at head. curl retries 5xx and refused connections; a 503 "behind" is retried
      # the same way and then fails here.
      - name: Read /health on the production host
        if: steps.gate.outputs.configured == 'true'
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: |
          url="${API_ORIGIN%/}/health"
          response="$(curl -sS --retry 5 --retry-delay 10 --retry-all-errors --max-time 60 \
            -w '\n%{http_code}' "$url" || true)"
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          echo "GET $url -> $status $body"
          migrations="$(printf '%s' "$body" | jq -r '.migrations // empty' 2>/dev/null || true)"
          if [ "$migrations" != "current" ]; then
            echo "::error::GET $url answered $status with migrations=${migrations:-absent}. Production already serves this deployment: roll back (docs/ops/deployment.md, Rollback)"
            exit 1
          fi
