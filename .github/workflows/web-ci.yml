name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      # A backend shape change is precisely what api-types-fresh must catch, so it
      # has to be able to trigger this workflow. Without it the anti-R3 gate only
      # runs when the frontend changes — which is never the failing case.
      - "backend/app/**"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "backend/app/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Dependency boundaries
        run: pnpm depcruise

      # This step is also where the stylesheet gates live, and none of them is
      # reachable from any other job. `src/app/theme-tokens.test.ts` compiles
      # `globals.css` through the real Tailwind pipeline and fails when an
      # `@theme` token cannot resolve (seed S-007); `contrast.test.ts` measures
      # the token pairs against WCAG AA (S-003, S-006); `focus-ring.test.ts`
      # scans for a focus ring shipped without its offset (S-005). CSS the
      # browser drops is not a build error, so `pnpm build` passing says nothing
      # about any of the three.
      - name: Unit tests
        run: pnpm test:unit

      - name: Component tests
        run: pnpm test:component

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com/api/v1
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  api-types-fresh:
    # The anti-drift gate (risk R3): if the backend changed shape and the web
    # client did not regenerate, this job fails instead of production breaking.
    #
    # No Postgres service, no uvicorn, no readiness poll. FastAPI prints the same
    # OpenAPI document straight from the app object, and the TypeScript generated
    # from it is byte-identical to the TypeScript generated over HTTP — verified by
    # diff. Booting a web server to read a static document was pure cost, and the
    # database it waited on was never touched.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Dump the OpenAPI schema
        working-directory: backend
        # Same values backend-ci.yml uses. Nothing connects: settings are read at
        # import time, so they must parse, but no query runs.
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/family_roots_test
          APP_ENV: testing
          APP_SECRET_KEY: test-secret-key
        run: |
          uv sync --frozen
          uv run python -c "import json; from app.main import create_app; print(json.dumps(create_app().openapi()))" \
            > "$RUNNER_TEMP/openapi.json"

      - name: Regenerate and diff
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm gen:api "$RUNNER_TEMP/openapi.json"
          git diff --exit-code src/generated \
            || { echo "::error::src/generated is stale — run 'pnpm gen:api' and commit"; exit 1; }

  deploy:
    needs: [build-and-test, e2e, api-types-fresh]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # Deploy secrets are an owner go-live action. Until VERCEL_TOKEN exists,
      # skip with a warning instead of failing the run (an empty --token= made
      # every merge to main go red). Once the secret is added, deploys resume
      # automatically on the next push.
      - name: Check deploy token
        id: gate
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret not configured — skipping Vercel deploy (owner go-live action)"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.gate.outputs.configured == 'true'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Setup Node.js
        if: steps.gate.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.gate.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Deploy to Vercel
        if: steps.gate.outputs.configured == 'true'
        run: pnpm dlx vercel deploy --prod --token="$VERCEL_TOKEN"
