name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      # A backend shape change is precisely what api-types-fresh must catch, so it
      # has to be able to trigger this workflow. Without it the anti-R3 gate only
      # runs when the frontend changes — which is never the failing case.
      - "backend/app/**"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "backend/app/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          # The legacy ratchet below reads the baseline at the merge base, so it needs history.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Dependency boundaries
        run: pnpm depcruise

      # ADR-060 § 4. `pnpm depcruise` admits every legacy import the committed baseline lists, so
      # on its own it admits whatever a pull request regenerates the baseline to include. This
      # compares the baseline with the one at the merge base and fails on an added entry, or on an
      # entry whose import is gone. See web/CLAUDE.md, "Migration notes".
      - name: Legacy baseline only shrinks
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm depcruise:ratchet "$BASE_SHA"

      # This step is also where the stylesheet gates live, and none of them is
      # reachable from any other job. `src/app/theme-tokens.test.ts` compiles
      # `globals.css` through the real Tailwind pipeline and fails when an
      # `@theme` token cannot resolve; `contrast.test.ts` measures
      # the token pairs against WCAG AA; `focus-ring.test.ts`
      # scans for a focus ring shipped without its offset. CSS the
      # browser drops is not a build error, so `pnpm build` passing says nothing
      # about any of the three.
      - name: Unit tests
        run: pnpm test:unit

      - name: Component tests
        run: pnpm test:component

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com/api/v1
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  api-types-fresh:
    # The anti-drift gate (risk R3): if the backend changed shape and the web
    # client did not regenerate, this job fails instead of production breaking.
    #
    # No Postgres service, no uvicorn, no readiness poll. FastAPI prints the same
    # OpenAPI document straight from the app object, and the TypeScript generated
    # from it is byte-identical to the TypeScript generated over HTTP — verified by
    # diff. Booting a web server to read a static document was pure cost, and the
    # database it waited on was never touched.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Dump the OpenAPI schema
        working-directory: backend
        # Same values backend-ci.yml uses. Nothing connects: settings are read at
        # import time, so they must parse, but no query runs.
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/family_roots_test
          APP_ENV: testing
          APP_SECRET_KEY: test-secret-key
        run: |
          uv sync --frozen
          uv run python -c "import json; from app.main import create_app; print(json.dumps(create_app().openapi()))" \
            > "$RUNNER_TEMP/openapi.json"

      - name: Regenerate and diff
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm gen:api "$RUNNER_TEMP/openapi.json"
          git diff --exit-code src/generated \
            || { echo "::error::src/generated is stale — run 'pnpm gen:api' and commit"; exit 1; }

  deploy:
    needs: [build-and-test, e2e, api-types-fresh]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    # The secrets reach only the two steps that read them, never `pnpm install`.
    steps:
      - uses: actions/checkout@v4

      # Deploy secrets are an owner go-live action (docs/ops/deployment.md, "Go-live
      # checklist"). Until all three exist, skip with a warning instead of failing the
      # run (an empty --token= made every merge to main go red). The warning names what
      # is missing. Once they are added, deploys resume automatically on the next push.
      # VERCEL_ORG_ID and VERCEL_PROJECT_ID name familyroots-web. With the token alone
      # the CLI would try to link or create a project instead (#252).
      - name: Check deploy configuration
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_WEB_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_WEB_PROJECT_ID" ] || missing="$missing VERCEL_WEB_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::warning::Web deploy not configured (missing secrets:$missing) — skipping Vercel deploy (owner go-live action)"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.gate.outputs.configured == 'true'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Setup Node.js
        if: steps.gate.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.gate.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      # No --yes, for the reason backend-ci.yml's deploy step gives: with the ids wrong,
      # this should fail rather than set up a project. The CLI is pinned so a deploy does
      # not change tool between two runs; backend-ci.yml pins the same version.
      - name: Deploy to Vercel (familyroots-web)
        if: steps.gate.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
        run: pnpm dlx vercel@63.1.0 deploy --prod --token="$VERCEL_TOKEN"
