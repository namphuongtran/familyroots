[alembic]
script_location = migrations
prepend_sys_path = .
# Split prepend_sys_path on the OS path separator. Without it alembic 1.18.5+
# warns and falls back to legacy splitting on spaces, commas and colons — which
# would mangle any path containing a space (this repo lives under "Macext01 HD").
path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
