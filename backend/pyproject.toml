[project]
name = "family-roots-backend"
version = "0.1.0"
description = "FamilyRoots — FastAPI backend service for Vietnamese family genealogy platform"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.141.1",
    # FastAPI itself declares only starlette>=0.46.0 with no upper bound, so its
    # major version is decided silently by whichever transitive dependency happens
    # to pin tightest (prometheus-fastapi-instrumentator forced 1.x here). Declared
    # directly so any future major bump shows up in a diff a human reads, not only
    # in uv.lock.
    "starlette>=1.3.1,<2",
    "uvicorn[standard]>=0.52.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "psycopg[binary]>=3.3.4",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "alembic>=1.18.5",
    "python-jose[cryptography]>=3.5.0",
    # httpx is frozen at 0.28.1; httpx2 is its successor and the client Starlette 1.x
    # wants (TestClient warns without it). Both are present because supabase and
    # firebase-admin still pull httpx transitively — first-party code uses httpx2.
    "httpx2>=2.9.1",
    "supabase>=2.31.0",
    "firebase-admin>=7.5.0",
    "python-multipart>=0.0.32",
    "apscheduler>=3.11.3",
    "sentry-sdk[fastapi]>=2.66.1",
    "prometheus-fastapi-instrumentator>=8.1.0",
]

[project.optional-dependencies]

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ``migrations`` ships alongside ``app`` because app/core/readiness.py reads the
# expected head revision from it at runtime, and backend/Dockerfile installs the
# project with ``uv sync --no-editable``. A wheel that carries only ``app`` puts
# the scripts out of the running code's reach, which is that defect: the
# production image could not boot against a fully migrated database.
packages = ["app", "migrations"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["A", "E", "W", "F", "I", "B", "C4", "UP", "SIM", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"app/api/v1/*.py" = ["B008"]
"app/core/security.py" = ["B008"]
"app/core/permissions.py" = ["B008"]
"app/infrastructure/dependencies.py" = ["B008"]
"app/main.py" = ["B008"]
"app/models/*.py" = ["A003"]
"migrations/**/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "app.services.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "app.application.person.claim_handlers",
    "app.application.clan.handlers",
    "app.application.auth.handlers",
    "app.infrastructure.persistence.*",
    "app.infrastructure.dependencies",
]
warn_return_any = false
disable_error_code = ["arg-type", "attr-defined", "return-value", "unused-ignore"]

[[tool.mypy.overrides]]
module = [
    "sentry_sdk",
    "firebase_admin.*",
    "supabase.*",
    "jose.*",
    "apscheduler.*",
    "prometheus_fastapi_instrumentator",
]
ignore_missing_imports = true

# ── Hexagonal boundaries, enforced by machine (run: uv run lint-imports) ──
# The convention lived only in CLAUDE.md/reviews before; import-linter makes a
# violation a CI failure instead of a review catch. "Ratchet" contracts pin
# today's known debt via ignore_imports — the lists may shrink, never grow.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain layer is pure: no outer layers, no frameworks"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.api",
    "app.application",
    "app.core",
    "app.i18n",
    "app.infrastructure",
    "app.main",
    "app.middleware",
    "app.models",
    "app.schemas",
    "app.services",
    "fastapi",
    "starlette",
    "sqlalchemy",
    "psycopg",
    "asyncpg",
    "pydantic",
    "pydantic_settings",
    "alembic",
    "supabase",
    "httpx",
    "httpx2",
    "jose",
    "firebase_admin",
    "apscheduler",
]

[[tool.importlinter.contracts]]
name = "Application layer depends inward only (never on adapters or routes)"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = [
    "app.api",
    "app.infrastructure",
    "app.main",
    "app.middleware",
]

[[tool.importlinter.contracts]]
name = "Application must not import ORM models (CQRS write side goes through domain + ports)"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = ["app.models"]
allow_indirect_imports = true
# Ratchet fully burned down (2026-07-05): no application handler constructs ORM models;
# they all go through repository factory methods. No exceptions remain.

[[tool.importlinter.contracts]]
# translator/descriptor are service-layer helpers; config should be injected;
# pagination is a read-side helper. Phase 2 cleanup targets. (The core.exceptions
# entries were burned 2026-07-16 — application raises only domain exceptions now.)
name = "Ratchet: application must not import core/services/i18n (domain + schemas only)"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = ["app.core", "app.services", "app.i18n"]
allow_indirect_imports = true
ignore_imports = [
    "app.application.auth.handlers -> app.services.translator",
    "app.application.document.handlers -> app.core.pagination",
    "app.application.event.handlers -> app.core.pagination",
    "app.application.invitation.handlers -> app.core.config",
    "app.application.person.claim_handlers -> app.core.pagination",
    "app.application.person.handlers -> app.core.pagination",
    "app.application.tree.handlers -> app.services.relationship_descriptor",
]

[[tool.importlinter.contracts]]
# app.services is the legacy cross-cutting layer (scheduler, notifications,
# exports, tree SQL, translator). Its background jobs run OUTSIDE the
# UoW/domain-event pattern by design (they commit their own sessions) —
# sanctioned out-of-band writers, but fenced: services must never reach into
# the hexagon (api/application/domain) or touch ORM models directly, so this
# layer cannot grow new pattern debt. New aggregates go through
# application/ + infrastructure/, not here.
name = "services layer never imports api/application/domain/models"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["app.api", "app.application", "app.domain", "app.models"]
# Direct imports only: core legitimately touches domain (exception mapping,
# config constants) and services legitimately import core.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "API layer never touches SQLAlchemy or ORM models directly"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["sqlalchemy", "app.models"]
allow_indirect_imports = true
ignore_imports = [
    # get_super_admin returns the UserProfile ORM row; the route needs the type.
    # Known debt — remove when core/security grows a read-model for it.
    "app.api.v1.platform_admin -> app.models.user_profile",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]
# Test output stays pristine, so every silenced warning needs a reason and a
# narrow match — never a blanket ignore.
filterwarnings = [
    # firebase-admin 7.5 wants Message.fid, a Firebase Installation ID. We target
    # devices by registration token, which is a different identifier and a
    # mutually exclusive wire field. Migrating requires a mobile-client change
    # first — see the comment in app/services/notification.py.
    "ignore:Message.token is deprecated:DeprecationWarning",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "import-linter>=2.13",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "types-python-jose>=3.3.0",
]
