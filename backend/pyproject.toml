[project]
name = "family-roots-backend"
version = "0.1.0"
description = "FamilyRoots — FastAPI backend service for Vietnamese family genealogy platform"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.41.0",
    "sqlalchemy[asyncio]>=2.0.48",
    "asyncpg>=0.31.0",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.13.1",
    "alembic>=1.18.4",
    "python-jose[cryptography]>=3.5.0",
    "httpx>=0.28.1",
    "supabase>=2.28.0",
    "firebase-admin>=7.2.0",
    "python-multipart>=0.0.22",
    "apscheduler>=3.11.2",
    "sentry-sdk[fastapi]>=2.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["A", "E", "W", "F", "I", "B", "C4", "UP", "SIM", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"app/api/v1/*.py" = ["B008"]
"app/core/security.py" = ["B008"]
"app/core/permissions.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[dependency-groups]
dev = [
    "psycopg2-binary>=2.9.11",
    "ruff>=0.15.5",
    "types-python-jose>=3.3.0",
]
