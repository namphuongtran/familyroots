[project]
name = "family-roots-backend"
version = "0.1.0"
description = "FamilyRoots — FastAPI backend service for Vietnamese family genealogy platform"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.41.0",
    "sqlalchemy[asyncio]>=2.0.48",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.13.1",
    "alembic>=1.18.4",
    "python-jose[cryptography]>=3.5.0",
    "httpx>=0.28.1",
    "supabase>=2.28.0",
    "firebase-admin>=7.2.0",
    "python-multipart>=0.0.22",
    "apscheduler>=3.11.2",
    "sentry-sdk[fastapi]>=2.54.0",
]

[project.optional-dependencies]

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["A", "E", "W", "F", "I", "B", "C4", "UP", "SIM", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"app/api/v1/*.py" = ["B008"]
"app/core/security.py" = ["B008"]
"app/core/permissions.py" = ["B008"]
"app/infrastructure/dependencies.py" = ["B008"]
"app/main.py" = ["B008"]
"app/models/*.py" = ["A003"]
"migrations/**/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "app.services.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "app.application.person.claim_handlers",
    "app.application.clan.handlers",
    "app.application.auth.handlers",
    "app.infrastructure.persistence.*",
    "app.infrastructure.dependencies",
]
warn_return_any = false
disable_error_code = ["arg-type", "attr-defined", "return-value", "unused-ignore"]

[[tool.mypy.overrides]]
module = [
    "sentry_sdk",
    "firebase_admin.*",
    "supabase.*",
    "jose.*",
    "apscheduler.*",
]
ignore_missing_imports = true

# ── Hexagonal boundaries, enforced by machine (run: uv run lint-imports) ──
# The convention lived only in CLAUDE.md/reviews before; import-linter makes a
# violation a CI failure instead of a review catch. "Ratchet" contracts pin
# today's known debt via ignore_imports — the lists may shrink, never grow.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain layer is pure: no outer layers, no frameworks"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.api",
    "app.application",
    "app.core",
    "app.i18n",
    "app.infrastructure",
    "app.main",
    "app.middleware",
    "app.models",
    "app.schemas",
    "app.services",
    "fastapi",
    "starlette",
    "sqlalchemy",
    "psycopg",
    "asyncpg",
    "pydantic",
    "pydantic_settings",
    "alembic",
    "supabase",
    "httpx",
    "jose",
    "firebase_admin",
    "apscheduler",
]

[[tool.importlinter.contracts]]
name = "Application layer depends inward only (never on adapters or routes)"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = [
    "app.api",
    "app.infrastructure",
    "app.main",
    "app.middleware",
]

[[tool.importlinter.contracts]]
name = "Ratchet: application must not import ORM models (CQRS write side goes through domain + ports)"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = ["app.models"]
allow_indirect_imports = true
ignore_imports = [
    "app.application.auth.handlers -> app.models.clan",
    "app.application.auth.handlers -> app.models.user_clan_role",
    "app.application.person.claim_handlers -> app.models.audit_log",
    "app.application.person.claim_handlers -> app.models.identity_claim",
    "app.application.person.claim_handlers -> app.models.user_clan_role",
]

[[tool.importlinter.contracts]]
# app.core.exceptions subclasses HTTPException, so these imports leak the
# framework into use-cases (domain exceptions in app.domain.shared.exceptions
# are the replacement); translator/descriptor are service-layer helpers; config
# should be injected. All are Phase 2 cleanup targets.
name = "Ratchet: application must not import core/services/i18n (domain + schemas only)"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = ["app.core", "app.services", "app.i18n"]
allow_indirect_imports = true
ignore_imports = [
    "app.application.auth.handlers -> app.core.exceptions",
    "app.application.auth.handlers -> app.services.translator",
    "app.application.document.handlers -> app.core.pagination",
    "app.application.event.handlers -> app.core.pagination",
    "app.application.invitation.handlers -> app.core.config",
    "app.application.me.handlers -> app.core.exceptions",
    "app.application.person.claim_handlers -> app.core.exceptions",
    "app.application.platform_admin.handlers -> app.core.exceptions",
    "app.application.tree.handlers -> app.services.relationship_descriptor",
]

[[tool.importlinter.contracts]]
name = "API layer never touches SQLAlchemy or ORM models directly"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["sqlalchemy", "app.models"]
allow_indirect_imports = true
ignore_imports = [
    # get_super_admin returns the UserProfile ORM row; the route needs the type.
    # Known debt — remove when core/security grows a read-model for it.
    "app.api.v1.platform_admin -> app.models.user_profile",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.13",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.5",
    "types-python-jose>=3.3.0",
]
